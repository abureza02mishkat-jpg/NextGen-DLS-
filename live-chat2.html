<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>NextGen DLS - Live Chat</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        let initTheme = localStorage.getItem('savedTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', initTheme);
        let initLang = localStorage.getItem('savedLang') || 'bn';
        document.documentElement.setAttribute('data-lang', initLang);
        document.documentElement.dir = (initLang === 'ar') ? 'rtl' : 'ltr';
    </script>

    <style>
        :root {
            --bg-main: #05080f; 
            --text-color: #f8fafc;
            --card-bg: #111827; 
            --card-border: rgba(255, 255, 255, 0.06);
            --accent-start: #f97316; 
        }

        :root[data-theme="light"] {
            --bg-main: #eef2f6;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-main); color: var(--text-color); 
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container { 
            width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 100%; position: relative; background: var(--bg-main);
        }

        /* Top Header Navigation */
        .chat-header {
            display: flex; align-items: center; justify-content: center; padding: 15px 20px;
            background: var(--card-bg); border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 20;
        }

        .header-title-wrapper {
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .header-title {
            font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800; color: var(--accent-start); text-transform: uppercase;
        }

        /* Iframe Container */
        .chat-iframe-container {
            flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative;
        }

        .chat-iframe-container iframe {
            width: 100%; height: 100%; border: none; position: relative; z-index: 1;
        }

        /* Loader Animation Styles */
        .loader-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-main); z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid var(--card-border);
            border-top: 4px solid var(--accent-start);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        .loading-text { 
            font-size: 13px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.5px;
        }
        /* Page Entry Animation */
body {
    animation: pageFadeIn 0.35s ease-out forwards;
}

@keyframes pageFadeIn {
    from {
        opacity: 0;
        transform: translateY(15px); /* নিচ থেকে হালকা উপরে উঠবে */
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style>
</head>
<body>

<div class="app-container">
    <div class="chat-header">
        <div class="header-title-wrapper">
            <i class="fa-solid fa-headset" style="color: var(--accent-start); font-size: 20px;"></i>
            <div class="header-title" data-bn="লাইভ সাপোর্ট" data-en="Live Support" data-vi="Hỗ trợ Trực tiếp" data-ar="الدعم المباشر">লাইভ সাপোর্ট</div>
        </div>
    </div>

    <div class="chat-iframe-container">
        <!-- Loader Animation -->
        <div id="chat-loader" class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text" data-bn="চ্যাট লোড হচ্ছে..." data-en="Loading Chat..." data-vi="Đang tải..." data-ar="جاري تحميل الدردشة...">চ্যাট লোড হচ্ছে...</div>
        </div>

        <!-- 🔥 Crisp Chat Iframe with Microphone & Camera Permission 🔥 -->
        <iframe id="chatIframe" src="https://go.crisp.chat/chat/embed/?website_id=bf4c6f9b-b6f8-48fc-8f5b-d89b8fa5cb1e" allow="microphone; camera"></iframe>
    </div>
</div>

<script>
    // ভাষা চেঞ্জ করার লজিক
    window.addEventListener('DOMContentLoaded', () => {
        let currentLang = localStorage.getItem('savedLang') || 'bn';
        document.querySelectorAll('[data-bn]').forEach(el => {
            const text = el.getAttribute('data-' + currentLang);
            if(text) el.innerText = text;
        });
    });

    // স্পিনার রিমুভ করার লজিক
    document.getElementById('chatIframe').onload = function() {
        setTimeout(() => {
            const loader = document.getElementById('chat-loader');
            loader.style.opacity = '0';
            
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500); 
        }, 3500); 
    };
</script>

</body>
</html>

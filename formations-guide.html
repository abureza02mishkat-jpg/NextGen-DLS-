    <script>
        (function() {
            let savedTheme = localStorage.getItem('savedTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            let savedLang = localStorage.getItem('savedLang') || 'bn';
            document.documentElement.setAttribute('data-lang', savedLang);

            // 🔥 জুম আটকানোর ম্যাজিক কোড 🔥
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) { event.preventDefault(); } 
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) { event.preventDefault(); } 
                lastTouchEnd = now;
            }, false);
            
            document.addEventListener('wheel', function(event) {
                if (event.ctrlKey) event.preventDefault(); 
            }, { passive: false });

            // 🔥 সার্চ বক্সে Null প্রবলেম ফিক্স করার ম্যাজিক 🔥
            document.addEventListener("DOMContentLoaded", function() {
                let searchInput = document.getElementById('searchInput');
                if(searchInput) {
                    // এখানে আপনার কথামতো "ফর্মেশন খুঁজুন..." সেট করে দিয়েছি
                    searchInput.placeholder = (savedLang === 'en') ? 'Search Formation...' : 'ফর্মেশন খুঁজুন...';
                }
            });
        })();
    </script>

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; color: var(--text-color);
            background: var(--card-bg); padding: 10px 20px; border-radius: 30px;

        /* সার্চ বক্স */

            display: flex; align-items: center; background: var(--card-bg); border-radius: 100px;
            padding: 12px 20px; margin-bottom: 25px; box-shadow: var(--inset-shadow);

        .formation-card {

                    <p>৪-৪-২ ফরমেশনে সফল হতে হলে আপনাকে অবশ্যই ডিফেন্সিভ মোডে খেলার মানসিকতা রাখতে হবে। শর্ট পাসের মাধ্যমে বিল্ড-আপ গেম খেলা এই ফরমেশনের সাফল্যের চাবিকাঠি। যদিও শুরুতে ডিফেন্স সামলানো বা চারজন মিডফিল্ডারের সাথে মানিয়ে নেওয়া কঠিন মনে হতে পারে, কিন্তু একবার আপনি এই পদ্ধতিতে অভ্যস্ত হয়ে গেলে আপনার গেমপ্লে অন্য উচ্চতায় পৌঁছে যাবে।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>4-4-2 is one of the most popular and classic formations in football. However, it's better to clarify one thing first—there are many differences in formation effectiveness between real-life football and the game. Therefore, we have structured this discussion entirely based on gameplay and in-game experience.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Strengths</span></div>
                    <p>1. One of the biggest strengths of this formation is its midfield. Here you get four midfielders, two of whom operate on the wings (RM and LM) and two in the center (CM). If you like to play by dominating the midfield, this can be a great choice for you. However, remember that controlling four midfielders properly is quite challenging. This requires a lot of practice and patience. You must be extremely conscious regarding long passes from the sides. There is a risk of losing the ball if you give long passes without checking the position or in a hurry, so if you can keep control of the passes wisely, this formation will give you a unique gaming experience.</p>
                    <p style="margin-top:15px;">2. Speaking of the attack, in this formation you get two proper center-forwards. According to the current DLS meta, it is quite difficult to score goals only by playing crosses. In that place, since there are two forwards in the 4-4-2 formation, it becomes very easy to play a passing game. Quick passing from one striker to another is much more effective for scoring goals. For those who prefer direct passing in the attack, this is one of the best options.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>
                    <p>1. The biggest challenge of this formation is managing the defense. Since opponents in DLS also often play with two strikers, there is a lot of pressure on your two center-backs. If a defender loses position or makes a mistake in tackling, the opponent can easily score a goal.</p>
                    <p style="margin-top:15px;">2. An interesting point here is that the role of your full-backs (RB and LB) is not very noticeable in this formation. Since the midfielders (RM/LM) are in front, they have less chance to move upwards, and again the main work of defense is done by the center-backs. This is because such opponents are rarely found in DLS who play with LW/RW that LB/RB will be needed to stop them. Therefore, the defense line might have been more consolidated if played with three defenders instead of four. However, if you can use the full-backs to move the ball up through the wings, your attack will be sharper.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>To be successful in the 4-4-2 formation, you must have the mindset of playing in defensive mode. Playing a build-up game through short passes is the key to success for this formation. Although it may seem difficult to manage the defense or adapt to four midfielders at first, once you get used to this method, your gameplay will reach another level.</p>
                </div>`
            },
                        "3-4-2-1": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>
                    <p>আজকে আমরা আলোচনা করবো ডিএলএস-এর ফরমেশনগুলোর মধ্যে অন্যতম সেরা এবং কার্যকর একটি ফরমেশন ৩-৪-২-১ নিয়ে। এই ফরমেশনের অধিকাংশ দিকই ইতিবাচক। যারা একটু বুঝেশুনে কৌশলগত গেমপ্লে পছন্দ করেন, তাদের জন্য এটি দারুণ একটি চয়েস হতে পারে।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">প্রতিরক্ষা ও উইং ব্যাক</span></div>
                    <p>১. এই ফরমেশনে আপনি পাচ্ছেন তিনজন প্রপার সেন্টার ব্যাক (CB) যারা মূলত মিড-রেঞ্জে অর্থাৎ ডি-বক্সের সামনের অংশটুকু ফিলাপ করে রাখে। এতে প্রতিপক্ষের পক্ষে আপনার ডিফেন্স লাইন ভাঙা অনেক কঠিন হয়ে যায়।</p>
                    <p style="margin-top:15px;">২. এর সাথে রয়েছে দুইজন RWB/LWB। আপনি যখন আক্রমণে উঠবেন তখন তারা উইঙ্গারের ভূমিকা পালন করবে, আবার প্রতিপক্ষ যখন অ্যাটাক করবে তখন তারা নিচে নেমে ডিফেন্সে সাহায্য করবে। আপনি চাইলে এখানে RB/LB-ও ব্যবহার করতে পারেন। তবে যদি গোল খেয়ে বসেন এবং সময় খুব কম থাকে, তবে এই দুইজনের জায়গায় স্পিডি RW/LW অথবা RM/LM নামিয়ে আক্রমণ বাড়াতে পারেন।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-cyan);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-cyan);">মিডফিল্ড ও আক্রমণ</span></div>
                    <p>১. এই ফরমেশনের মূল কারিগর হলো দুইজন প্রপার DM। পুরো ম্যাচ কন্ট্রোল করা এবং প্রতিপক্ষের আক্রমণ ট্যাকেল করার মূল দায়িত্ব তাদের ওপর। তাই এখানে শক্তিশালী দুইজন ডিফেন্সিভ মিডফিল্ডার থাকা জরুরি। প্রয়োজনে আপনি এখানে সিএম (CM) দিয়েও খেলাতে পারেন।</p>
                    <p style="margin-top:15px;">২. সবচেয়ে আকর্ষণীয় দিক হলো দুইজন AM। এরা প্লে-মেকার হিসেবে থাকলেও আক্রমণের সময় উপরে উঠে প্রপার ফরোয়ার্ডের কাজ করে। আপনি যখন অ্যাটাক করবেন তখন আপনার অ্যাটাকিং মিডফিল্ডাররা CF এর সাথে যোগ দিয়ে মোট তিনজন ফরোয়ার্ডের শক্তি তৈরি করবে। এই AM পজিশনে আপনি চাইলে উইঙ্গার বা SS পজিশনের প্লেয়ারও নামাতে পারেন।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>১. খেলার সময় অবশ্যই 'ডিফেন্সিভ মোড' বজায় রাখতে হবে। এই মোডে অ্যাটাক করার সময় ফরমেশনটি ৩-২-৪-১ এর মতো কাজ করে, আবার ডিফেন্সের সময় স্বয়ংক্রিয়ভাবে ৫-৪-১ ফরমেশনে পরিণত হয়।</p>
                    <p style="margin-top:10px;">২. যাদের টিমে স্পিডি প্লেয়ার আছে তাদের জন্য এটি বেশি কার্যকর। যাদের আইডি নতুন (Unmax) তাদের জন্য এই হাই-প্রেসিং ফরমেশনে টিকে থাকা কিছুটা কঠিন হতে পারে।</p>
                    <p style="margin-top:10px;">৩. এখানে লং পাস খেলার সুযোগ কম, আপনাকে শর্ট পাস বিল্ড-আপের ওপর নির্ভর করতে হবে। তবে উইং ব্যাকের একজনের থেকে অন্যজনের কাছে লং পাস দিয়ে সাইড জোন খালি করতে পারলে সহজেই গোল বের করা সম্ভব।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>Today we will discuss one of the best and most effective formations in DLS, the 3-4-2-1. Most aspects of this formation are positive. It can be a great choice for those who prefer tactical gameplay.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Defense & Wing-backs</span></div>
                    <p>1. You get three proper Center Backs (CB) who fill the mid-range area in front of the D-box. This makes it very difficult for the opponent to break your defensive line.</p>
                    <p style="margin-top:15px;">2. Combined with two RWB/LWBs who act as wingers during attacks and drop back to help the defense during opponent attacks. If you're trailing late in the game, you can replace them with speedy RW/LW or RM/LMs to increase attacking pressure.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-cyan);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-cyan);">Midfield & Attack</span></div>
                    <p>1. The key to this formation is the two proper DMs. They are responsible for controlling the match and tackling opponent attacks. Strong defensive midfielders are essential here.</p>
                    <p style="margin-top:15px;">2. The most attractive part is the two AMs. Though they are playmakers, they act as proper forwards during attacks. With the CF, they create a three-man forward force. You can use wingers or SS players in these AM positions for better pressing.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. Always maintain 'Defensive Mode'. In this mode, the formation acts as 3-2-4-1 during attacks and automatically switches to 5-4-1 during defense, maintaining perfect balance.</p>
                    <p style="margin-top:10px;">2. Most effective for teams with speedy players. It might be difficult for new (Unmax) IDs to sustain this high-pressing style.</p>
                    <p style="margin-top:10px;">3. Rely on short-pass build-ups rather than long passes. However, switching play between wing-backs to find empty side zones can lead to easy goals.</p>
                </div>`
            },
            "3-2-3-2": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>
                    <p>আজকে আমরা ডিএলএস-এর এমন একটা ফরমেশন নিয়ে কথা বলব যেটা অনেক পুরাতন হলেও এর কার্যকারিতা এখনো তুঙ্গে। ফরমেশনটি হলো ৩-২-৩-২। গেমে ট্যাকটিকস বারবার বদলালেও গত ২-৩ বছর ধরেই এই ফরমেশন টপ লেভেলের পারফরম্যান্স দিচ্ছে, তাই একে আমি 'পুরাতন কিন্তু গোল্ড' ফরমেশন বলি।</p>

                    <p>১. এই ফরমেশনে আপনি পাচ্ছেন তিনজন প্রপার Center Back (CB) যারা ডি-বক্সের সামনের জায়গাটা এমনভাবে ফিলাপ করে রাখে যে প্রতিপক্ষের পক্ষে ডিফেন্স ভাঙা কঠিন হয়ে যায়।</p>

                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">আক্রমণ ও মোড </span></div>

                    <p style="margin-top:15px;">২. এই ফরমেশনে 'Moderate' খেললে ব্যালেন্সড পারফরম্যান্স পাওয়া যায়। ডিফেন্সের সময় এটি ৫-৩-২ এবং অ্যাটাকের সময় ৩-৫-২ এর মতো কাজ করবে।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>বেশিরভাগ শর্ট পাস খেলতে হবে। তবে একপাশের LM/RM থেকে অন্য পাশে লং পাস দিয়ে জোন খালি হলে সহজেই অ্যাটাক করা যায়। সাইড থেকে ক্রস দিলে দুইজন CF-এর যে কেউ গোল করতে পারবে। এছাড়া AM-কে পাস দিয়ে ডি-বক্সের বাহির থেকে লং শট নেওয়া সম্ভব, তবে AM-এর Shot এবং Control অবশ্যই ৯৩+ থাকতে হবে।</p>

                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>Today we will talk about a formation that is old but still highly effective: the 3-2-3-2. Although game tactics change every year, this formation has provided top-level performance for the last 2-3 years, so I call it an 'Old but Gold' formation.</p>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Defense & Wing-backs</span></div>

                    <p>1. The biggest strength of this formation is its perfect defensive balance. With 4 players in the backline and 4 in the midfield, a total of 8 players are ready to defend, making it difficult for the opponent to find open spaces.></p>
                    <p style="margin-top:15px;">2. With 4 players in the midfield, you can control the game through both the wings and the center. The player behind the striker plays a free role, which is highly effective in confusing the opponent's defense.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses & Challenges</span></div>
                    <p>1. Isolation in the attack is the major minus point of this formation. With only one CF up front, they often become isolated among 2-3 opposing defenders. If the midfielders cannot move up quickly, creating goal-scoring opportunities becomes difficult.</p>
                    <p style="margin-top:15px;">2. The 4-4-1-1 formation is not very dynamic for quick passing or counter-attacking. It often slows down the pace of the game. Players who prefer scoring quick goals might find this slow-paced gameplay frustrating.
</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. To score goals in this formation, you need a player in the CF position with high Physical Strength and Height (like Haaland or Kane) so they can hold the ball up alone. The player behind them (SS) must be extremely fast—like Mbappe, or any highly-trained forward who might lack height but possesses superior passing and ball control. Furthermore, even if their STR isn't 100, their Spe, Acc, and Sho must be 100. Control and passing should be around 95.</p>
                    <p style="margin-top:15px;">2. You will get the best results playing in 'Defensive' or 'Moderate' mentality. Remember, this is not a formation designed for raining goals; it is a tactic focused on keeping the defense solid to win matches 1-0 or 2-0.
</p>
                </div>`
            },
            "4-5-1": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>
                    <p>৪-৫-১ ফরমেশনটি মূলত একটি অতি রক্ষণাত্মক কৌশল। এখানে মাঝমাঠকে ৫ জন প্লেয়ার দিয়ে এমনভাবে ব্লক করে রাখা হয় যে, প্রতিপক্ষের জন্য পাসিং গেম খেলা প্রায় অসম্ভব হয়ে পড়ে।  শক্তিশালী অপনেন্টের বিরুদ্ধে লিড ধরে রাখার জন্য এটি একটি দুর্দান্ত অপশন।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">ভালো দিকসমূ</span></div>
                    <p>১. এই ফরমেশনের সবচাইতে বড় শক্তি হলো মাঝমাঠের একাধিপত্য। ৫ জন মিডফিল্ডার থাকায় মাঠের প্রতিটি কোণ আপনার দখলে থাকবে এবং অপনেন্ট সহজে বল কন্ট্রোল করতে পারবে না।</p>
                    <p style="margin-top:15px;">২. এটি বিপজ্জনক কাউন্টার অ্যাটাকের জন্য দারুণ। মিডফিল্ডাররা বল কেড়ে নিয়ে দ্রুত উইং দিয়ে LM/RM-কে পাস দিলে তারা দ্রুত গতিতে ওপরে উঠে স্ট্রাইকারকে বল সাপ্লাই দিতে পারে এবং প্রতিপক্ষকে চমকে দিতে পারে।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">দুর্বলতা ও চ্যালেঞ্জ</span></div>
                    <p>১. স্ট্রাইকারের বিচ্ছিন্নতা এই ফরমেশনের প্রধান সমস্যা। সামনে মাত্র একজন CF থাকায় সে প্রতিপক্ষের ডিফেন্ডারদের মাঝে একা হয়ে পড়ে। মিডফিল্ডাররা দ্রুত সাপোর্ট না দিলে পুরো ম্যাচে গোলের সুযোগ তৈরি করা কঠিন হয়ে যায়।</p>
                    <p style="margin-top:15px;">২. আক্রমণে ধীরগতির কারণে যারা প্রচুর গোল করতে পছন্দ করেন, তাদের কাছে এই ফরমেশনটি একঘেয়ে বা বোরিং মনে হতে পারে। এটি দিয়ে চাইলেই হাই-ভোল্টেজ অ্যাটাকিং ফুটবল খেলা সম্ভব হয় না।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>১. মিডফিল্ডে পাঁচজন থাকায় আপনাকে অবশ্যই মাঝমাঠ ডমিনেট করতে হবে। তবে LM এবং RM-এর পরিবর্তে আপনি চাইলে LWB, RWB অথবা পাসিং স্ট্যাট ভালো এমন LB, RB ব্যবহার করতে পারেন। এতে ডিফেন্সিভ দিকটি আরও শক্তিশালী হবে। তাছাড়া তিনজন CM-এর পরিবর্তে একজন CM, একজন DM (মাঝখানের পজিশনে) এবং একজন AM ব্যবহার করা বেশি কার্যকরী।</p>
                    <p style="margin-top:15px;">২. এই ফরমেশনে সফল হওয়ার প্রধান উপায় হলো 'Defensive' মোডে খেলা। 'Moderate' মোডে খেলাটাও নিরাপদ, তবে 'Attacking' মোডে গেলে আপনার ৫ জন মিডফিল্ডারই অনেক ওপরে উঠে যাবে, ফলে কাউন্টার অ্যাটাকে গোল খাওয়ার ঝুঁকি বেড়ে যাবে। এটি মূলত প্রতিপক্ষকে হতাশ করে ম্যাচ বের করে আনার একটি কৌশল।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>The 4-5-1 formation is essentially an ultra-defensive tactic. The midfield is blocked with 5 players, making it nearly impossible for the opponent to play their passing game. It is the best choice for holding a lead against strong opponents.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Strengths</span></div>
                    <p>1. The greatest strength is midfield dominance. With 5 midfielders, every corner of the field is under your control, making it difficult for the opponent to maintain possession.</p>
                    <p style="margin-top:15px;">2. It's excellent for dangerous counter-attacks. When midfielders win the ball and quickly pass to LM/RM on the wings, they can rapidly push up to supply the striker and surprise the opponent.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>
                    <p>1. Striker isolation is the main issue. With only one CF, he often gets trapped among opponent defenders. Without quick support from the midfield, creating scoring chances becomes very hard.</p>
                    <p style="margin-top:15px;">2. Due to the slow pace of attack, players who love high-scoring games might find this formation boring. It's not designed for high-voltage attacking football.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. With five players in the middle, you must aim to dominate the midfield. However, instead of LM and RM, you can use LWB, RWB, or fullbacks (LB/RB) with high passing stats. This will significantly strengthen your defense. Additionally, instead of using three CMs, it is more effective to use one CM, one DM (in the central position), and one AM.</p>
                    <p style="margin-top:15px;">2. The key to success in this formation is playing in a 'Defensive' mentality. Playing in 'Moderate' mode is also safe, but if you switch to 'Attacking', all 5 of your midfielders will push too far forward, increasing the risk of conceding from counter-attacks. This tactic is essentially about frustrating the opponent to win the match.
</p>
                </div>`
            },
            "4-1-4-1": {
                bn: `

                    <p style="margin-top:15px;">২. মাঝমাঠে ৪ জন মিডফিল্ডার থাকায় পাসিংয়ের জন্য সব সময় একাধিক অপশন খোলা থাকে। বল পজিশন ধরে রেখে ধীরে ধীরে আক্রমণ বিল্ড-আপ করার জন্য এবং মাঝমাঠের নিয়ন্ত্রণ নিতে এটি খুবই কার্যকর।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">দুর্বলতা</span></div>

                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>১. এই ফরমেশনের সাফল্য নির্ভর করে DM এর ওপর। এখানে এমন কাউকে রাখুন যার Tackle এবং Strength ভালো (যেমন- রদ্রি)। স্ট্রাইকার হিসেবে ভালো Control এবং Shooting সম্পন্ন প্লেয়ার রাখা জরুরি যাতে সে মিডফিল্ডারদের ওপরে ওঠার সময় দিতে পারে।</p>
                    <p style="margin-top:15px;">২. এই ফরমেশনে সবচাইতে ভালো রেজাল্ট পাওয়া যায় 'Moderate' মোডে খেললে। এটি ডিফেন্সের সময় ৫-৪-১ এর মতো এবং আক্রমণের সময় ৪-৩-৩ এর মতো শেপ তৈরি করে। মাঝমাঠে পজিশন ধরে রাখাই হলো এর মূল ট্যাকটিকস।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>

            "4-3-2-1": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>

                    <p style="margin-top:15px;">২. যারা উইং দিয়ে দৌড়ে গিয়ে ক্রস দিতে অভ্যস্ত, তাদের কাছে এটি কঠিন মনে হতে পারে। কারণ এখানে সব আক্রমণ মাঝপথ দিয়েই করতে হয়। অপনেন্ট মাঝমাঠ ব্লক করে রাখলে গোল বের করা অনেক সময় অসম্ভব হয়ে পড়ে।</p>

                    <p>১. মিডফিল্ডে তিনজন CM-এর পরিবর্তে মাঝখানের পজিশনে একজন DM রাখুন। AM হিসেবে অবশ্যই সম্পূর্ণ আপগ্রেড করা (বেস্ট কোচিংয়ের) সেরা প্লেয়ার ব্যবহার করবেন। অ্যাটাকে বাড়তি সুবিধা পেতে চাইলে আপনি LW/RW, SS বা CF-ও ব্যবহার করতে পারেন, তবে খেয়াল রাখবেন যেন তাদের ট্যাকেলিং স্ট্যাট তুলনামূলক ভালো থাকে।</p>

                en: `

                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>The 4-3-2-1 formation is famously known as the 'Christmas Tree'. It is a narrow formation where 5 midfielders work in different layers, making it defensively solid and unparalleled for building play through the center.</p>

                    <p style="margin-top:15px;">2. The highlight is the 2 AMs acting as creative engines. Along with the lone CF, they can create triangular one-two passing moves that confuse opponent center-backs and create scoring chances.</p>

                    <p style="margin-top:15px;">2. 'Moderate' mode is most effective for this formation. The key to winning is staying patient, holding possession in midfield, and waiting for the right opening. Switch to 'Defensive' to hold a lead.</p>

            "4-1-2-3": {

                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>

            "4-2-1-3": {

                    <p style="margin-top:15px;">2. Having a dedicated AM makes it easy to supply balls to the three forwards (LW, RW, CF). The AM keeps constant pressure on the opponent's defense by providing crucial through-balls.</p>

                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>
                    <p>1. A large gap can form between the two CMs and the AM. If your AM stays too high in attack and fails to track back, the opponent can easily seize control of the midfield with quick passing.</p>
                    <p style="margin-top:15px;">2. With fewer players in midfield, the full-backs (RB/LB) carry more responsibility. If they push up and lose possession, opponent wingers can exploit the empty flanks for quick counter-attacks.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. In the two CM positions, deploy players who excel in both defending and passing. It is advantageous if one of them is 'Both Footed'. If you are relatively weak at possession and passing games, you can use a DM for added safety. For the AM position, always use your team's best playmaker (like Messi or De Bruyne) with a high Shooting (Sho) stat.</p>
                    <p style="margin-top:15px;">2. Best results are achieved on 'Moderate' or 'Attacking' mode. Against stronger opponents, stay on 'Defensive' and wait for counter-attack opportunities. Quick one-two passes between the AM and wingers are key to scoring.</p>
                </div>`
            },
            "5-3-2": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>
                    <p>৫-৩-২ ফরমেশনটি মূলত একটি অতি-রক্ষণাত্মক কৌশল যেখানে আপনার গোলপোস্টের সামনে ৩ জন CB এবং ২ জন ফুল-ব্যাক মিলে ৫ জনের একটি নিরেট দেয়াল তৈরি করে রাখে। এটি শক্তিশালী প্রতিপক্ষের আক্রমণ সামলানো এবং লিড ধরে রাখার জন্য সেরা চয়েস।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">ভালো দিকসমূহ</span></div>
                    <p>১. এই ফরমেশনের সবচেয়ে বড় শক্তি হলো এর অভেদ্য রক্ষণভাগ। বক্সে ৩ জন সেন্টার ব্যাক থাকায় প্রতিপক্ষের স্ট্রাইকাররা জায়গা পায় না এবং যেকোনো ক্রস বা থ্রু-বল আপনার বাড়তি ডিফেন্ডাররা খুব সহজেই ক্লিয়ার করে দিতে পারে।</p>
                    <p style="margin-top:15px;">২. মাঝমাঠে ৩ জন CM থাকায় পজিশন হোল্ড করা সহজ হয়। বল কেড়ে নেওয়ার পর দ্রুত দুই স্ট্রাইকারকে বল সাপ্লাই দিলে হঠাৎ কাউন্টার অ্যাটাকে গোল পাওয়ার ভালো সম্ভাবনা তৈরি হয়। 'ক্লিন শিট' রাখার জন্য এটি গেমের সেরা ফরমেশন।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">দুর্বলতা</span></div>
                    <p>১. এই ফরমেশনে কোনো প্রপার উইঙ্গার (LW/RW) না থাকায় সাইড দিয়ে আক্রমণ করার সুযোগ খুব কম থাকে। যারা কেবল উইং দিয়ে ক্রস খেলে গোল করতে অভ্যস্ত, তাদের জন্য এই ফরমেশনে খেলা বেশ চ্যালেঞ্জিং হতে পারে।</p>
                    <p style="margin-top:15px;">২. উইঙ্গার নেই বলে মাঝেমধ্যে RB এবং LB-কে ওপরে উঠে আক্রমণে সাহায্য করতে হয়। তারা ওপরে থাকা অবস্থায় যদি বল পজিশন হারিয়ে ফেলেন, তবে ডিফেন্সের দুই সাইড একদম ফাঁকা হয়ে পড়ে যা আপনার জন্য বিপজ্জনক হতে পারে।</p>

                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>১. এই ফরমেশনে মিডফিল্ডের তিনজনের মধ্যে মাঝখানের পজিশনে একজন DM রাখুন। ফরোয়ার্ড এবং ফুল-ব্যাকদের (LB/RB) ওপর অনেক প্রেসার পড়ে, যে কারণে তাদের স্ট্যামিনা খুব দ্রুত শেষ হয়ে যায়। তাই সময়মতো সাবস্টিটিউট করাতে হবে। CM পজিশনে তুলনামূলক স্পিড বেশি এমন প্লেয়ার ব্যবহার করবেন। আর অবশ্যই চেষ্টা করবেন অন্তত একজন 'Both Footed' (দুই পায়েই খেলতে পারেন এমন) CM দলে রাখতে।</p>
                    <p style="margin-top:15px;">২. এই ফরমেশনের জন্য 'Defensive' বা 'Moderate' মোড সবচাইতে আদর্শ। খুব প্রয়োজন না হলে অ্যাটাকিং মোডে যাবেন না, কারণ এতে মাঝমাঠ ফাঁকা হয়ে পড়ার ঝুঁকি থাকে। ধৈর্য ধরে ডিফেন্স ঠিক রেখে প্রতিপক্ষের ভুলের সুযোগ নেয়াই মূল কৌশল।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>The 5-3-2 formation is an ultra-defensive tactic where 3 CBs and 2 full-backs create a solid 5-man wall in front of your goal. It is the best choice for withstanding heavy pressure and holding a lead.</p>

                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Strengths</span></div>
                    <p>1. The greatest strength is the impenetrable defense. With 3 CBs in the box, opponent strikers find no space, and any crosses or through-balls are easily cleared by your extra defenders.</p>
                    <p style="margin-top:15px;">2. Having 3 CMs helps in maintaining possession. Once the ball is won, supplying it quickly to the two strikers creates great opportunities for sudden counter-attack goals. It is one of the best formations for a clean sheet.</p>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. Among the three midfielders, place a DM in the central position. The forwards and full-backs (LB/RB) face a lot of pressure, causing their stamina to deplete quickly, so making timely substitutions is crucial. In the CM positions, try to use players with relatively high speed. Additionally, make sure to include at least one 'Both Footed' CM.</p>
                    <p style="margin-top:15px;">2. 'Defensive' or 'Moderate' modes are ideal for this formation. Avoid attacking mode unless necessary, as it leaves the midfield empty. The key is to stay patient, maintain the defense, and exploit opponent mistakes.</p>
                </div>`
            },
            "5-2-1-2": {

                    <p style="margin-top:15px;">২. এই ফরমেশনে 'Moderate' মোড সবচাইতে ভালো ফল দেয়। এতে ডিফেন্স এবং আক্রমণ—উভয় দিকেই সাপোর্ট পাওয়া যায়। তবে লিড পাওয়ার পর 'Defensive' মোডে চলে গিয়ে কাউন্টার অ্যাটাকের জন্য অপেক্ষা করাই বুদ্ধিমানের কাজ।</p>

                en: `

            "5-2-3": {

                    <p>১. এই ফরমেশনের বড় শক্তি হলো এর অভেদ্য রক্ষণাত্মক স্তর। ৫ জন ডিফেন্ডারের সামনে একজন DM থাকায় একটি অতিরিক্ত প্রোটেকশন লেয়ার তৈরি হয়, যা প্রতিপক্ষের থ্রু-বল মাঝপথেই আটকে দিতে অত্যন্ত কার্যকর।</p>
                    <p style="margin-top:15px;">২. মাঝমাঠে অনেকগুলো লেয়ার থাকায় ছোট ছোট পাসের মাধ্যমে বল পজিশন ধরে রাখা সহজ হয়। DM থেকে CM, তারপর AM এবং শেষে CF—এই চেইনটি মেইনটেইন করে ধীরে ধীরে আক্রমণ সাজানোর জন্য এটি দারুণ একটি ফরমেশন।</p>

                    <p style="margin-top:15px;">২. এটি কোনো দ্রুত কাউন্টার অ্যাটাকিং ফরমেশন নয়। বল ডিফেন্স থেকে স্ট্রাইকার পর্যন্ত পৌঁছাতে বেশ সময় লাগে। যারা খুব দ্রুত গোল করতে পছন্দ করেন, তাদের কাছে এই গেমপ্লেটি ধীরগতির এবং বিরক্তিকর মনে হতে পারে।</p>

                    <p>১. আপনার DM পজিশনে এমন একজনকে রাখুন যার ইন্টারসেপশন (Interception) এবং পাসিং (Passing) দুটোই ভালো। আর একমাত্র CF হিসেবে একজন খুব শক্তিশালী এবং বল হোল্ড করতে পারে এমন প্লেয়ার (যেমন- হ্যালান্ড) রাখুন, যাতে মিডফিল্ডাররা ওপরে ওঠার জন্য পর্যাপ্ত সময় পায়।</p>
                    <p style="margin-top:15px;">২. এই ফরমেশনের জন্য 'Moderate' মোড সবচাইতে কার্যকর। আপনি যদি 'Defensive' মোডে খেলেন, তবে আক্রমণ করা বেশ কঠিন হয়ে যাবে। মাঝমাঠ দিয়ে ত্রিভুজ আকৃতির পাসিং খেলে গেম কন্ট্রোল করাই এই ফরমেশনের আসল শক্তি।
।</p>

                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>The 5-1-2-1-1 formation is a pyramid-shaped tactical setup. With a DM in front of 5 defenders, followed by 2 CMs, an AM, and a lone striker, it is designed to shut down opponent passing lanes through multiple layers.</p>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Strengths</span></div>
                    <p>1. The impenetrable defensive layers are the highlight. Having a DM right in front of the 5-man defense creates an extra protection layer that is highly effective at intercepting through-balls mid-pitch.</p>
                    <p style="margin-top:15px;">2. Multiple midfield layers make it easy to maintain possession through short passes. Moving the ball from DM to CM, then AM, and finally CF allows for a structured and steady build-up play.</p>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>

                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. Deploy a player in the DM position who excels in both Interception and Passing. For the lone CF position, use a physically strong player capable of holding up the ball (like Haaland), which will give your midfielders enough time to push forward and join the attack.</p>
                    <p style="margin-top:15px;">2. 'Moderate' mode is the most effective mentality for this formation. If you play in 'Defensive' mode, creating attacking opportunities will become very difficult. Dominating the game through triangular passing in the midfield is the true strength of this tactic.
</p>
                </div>`

                en: `
                <div class="guide-card">

                    <p style="margin-top:15px;">2. 'Attacking' or 'Moderate' modes yield the best results. However, try to bring your LM and RM back quickly during defense to form a 5-3-2 shape. This is a classic 'high risk, high reward' formation.</p>

                    <p style="margin-top:15px;">2. Playing in 'Attacking' mode offers a great advantage in this formation, as it allows for relentless attacking pressure. While you can start in attacking mode, switching to 'Defensive' or 'Moderate' mode to hold onto a lead is the wisest choice. This allows your wide players to drop back and support the defense, ensuring defensive security without completely blunting your attacking edge.</p>

                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">Strengths</span></div>
                    <p>1. The core strength lies in its layered midfield control. 3 midfielders and 1 AM form a triangular structure, making it easy to control the game through short passes and stop opponent attacks mid-pitch.</p>
                    <p style="margin-top:15px;">2. With LW, RW, and CF, the opponent's defense is constantly under pressure. It's particularly effective when the AM provides through-balls to the wingers, creating easy scoring chances from the flanks.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">Weaknesses</span></div>
                    <p>1. The lack of LB/RB is the biggest risk here. Since midfielders focus on the center, the flanks are exposed, making it difficult for the 3 CBs to cover wide areas against fast opponent wingers on the counter.</p>
                    <p style="margin-top:15px;">2. Midfielders face immense pressure. If they fail to track back quickly after losing possession, your defense becomes completely exposed, increasing the risk of conceding goals.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">Expert Tips</span></div>
                    <p>1. Keep at least one DM among the 3 midfielders. It is best to deploy the DM in the central position among the three. For the AM position, use a player whose shooting stat is between 95 and 100. However, keep in mind that adapting to this formation can be quite challenging for players.</p>
                    <p style="margin-top:15px;">2. Playing on 'Moderate' or 'Defensive' mode is the safest choice due to the lack of side backs. In these modes, midfielders drop deep to cover the defensive flanks, filling the gaps and helping to maintain a clean sheet.</p>
                </div>`
            },

        };

        const formList = [
            ['4-4-2','cyan'],['4-1-2-1-2','cyan'],['4-3-1-2','cyan'],['4-2-2-2','cyan'],['4-4-1-1','cyan'],['4-1-3-2','cyan'],
            ['4-5-1','cyan'],['4-1-4-1','cyan'],['4-2-3-1','cyan'],['4-3-2-1','cyan'],['4-3-3','cyan'],['4-1-2-3','cyan'],['4-2-1-3','cyan'],
            ['5-3-2','red'],['5-2-1-2','red'],['5-2-3','red'],['5-2-2-1','red'],['5-4-1','red'],['5-1-2-1-1','red'],
            ['3-5-2','green'],['3-2-3-2','green'],['3-1-4-2','green'],['3-4-1-2','green'],['3-5-1-1','green'],['3-4-3','green'],['3-4-2-1','green'],['3-1-2-1-3','green'],['3-3-1-3','green']
        ];

        const grid = document.getElementById('main-grid');
        formList.forEach(f => {
            const div = document.createElement('div');
            div.className = 'formation-card';
            div.setAttribute('data-name', f[0]);
            div.onclick = () => openDetails(f[0]);
            div.innerHTML = `<div class="formation-icon" style="color:var(--clr-${f[1]})">${f[0]}</div>`;
            grid.appendChild(div);
        });

        function search() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.formation-card').forEach(c => {
                c.style.display = c.getAttribute('data-name').toLowerCase().includes(val) ? 'block' : 'none';
            });
            
        }

        function openDetails(name) {
            const lang = localStorage.getItem('savedLang') || 'bn';
            document.getElementById('current-form-title').innerText = name;
            const content = formationDatabase[name] ? formationDatabase[name][lang] : `<div class="guide-card"><p style="text-align:center">${lang === 'bn' ? 'গাইড শীঘ্রই আসছে...' : 'Detailed guide coming soon...'}</p></div>`;
            document.getElementById('dynamic-content').innerHTML = content;
            document.getElementById('main-grid').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('formation-detail-container').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('formation-detail-container').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('main-grid').style.display = 'grid';
            document.getElementById('searchSection').style.display = 'flex';
        }

                function syncEverything() {
            try {
                // ১. থিম চেক (Light/Dark)
                const theme = localStorage.getItem('savedTheme') || 'dark';
                document.body.setAttribute('data-theme', theme);
                
                // ২. ভাষা চেক (BN/EN)
                const lang = localStorage.getItem('savedLang') || 'bn';
                document.querySelectorAll('[data-bn]').forEach(el => {
                    const text = el.getAttribute('data-' + lang);
                    if (text) el.innerText = text;
                });

                // সার্চ বক্সের প্লেসহোল্ডার
                let input = document.getElementById('searchInput');
                if (input) {
                    input.placeholder = input.getAttribute('data-' + lang + '-ph');
                }
            } catch(e) { console.error(e); }
        }

        // প্রতি ৫০০ মিলিসেকেন্ডে চেক করবে (যাতে মেইন পেজে থিম পাল্টালে এখানেও পাল্টায়)
        setInterval(syncEverything, 500);
        window.onload = syncEverything;

    </script>
</body>
</html>

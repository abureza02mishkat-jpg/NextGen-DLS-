<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>NEXTGEN DLS - Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            let savedTheme = localStorage.getItem('savedTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            let savedLang = localStorage.getItem('savedLang') || 'bn';
            document.documentElement.setAttribute('data-lang', savedLang);

            // 🔥 জাভাস্ক্রিপ্ট দিয়ে জুম আটকানোর চরম ম্যাজিক 🔥
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) { event.preventDefault(); } 
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) { event.preventDefault(); } 
                lastTouchEnd = now;
            }, false);
            
            document.addEventListener('wheel', function(event) {
                if (event.ctrlKey) event.preventDefault();
            }, { passive: false });
        })();
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        :root {
            --bg-main: #0b1120; 
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent: #f97316; 
            --text-dim: #94a3b8;
        }

        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dim: #64748b;
        }

        /* 🔥 ডানে-বামে নড়াচড়া এবং ডাবল-ট্যাপ জুম সম্পূর্ণ বন্ধ করার ম্যাজিক 🔥 */
        html, body { 
            background-color: var(--bg-main); 
            color: var(--text-color); 
            font-family: 'Poppins', sans-serif; 
            padding-bottom: 50px;
            transition: background-color 0.2s, color 0.2s;
            visibility: hidden; 
            width: 100vw;
            max-width: 100%;
            overflow-x: hidden; 
            touch-action: pan-y; 
            user-select: none; 
            -webkit-user-select: none;
        }

        a { -webkit-user-drag: none; }
        
        .header { 
            background: var(--card-bg); 
            padding: 25px 20px 20px 20px; 
            border-bottom: 2px solid var(--accent);
            position: fixed; 
            top: 0; 
            left: 0;
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
        }

        .header-title-wrapper { 
            display: flex; align-items: center; gap: 10px; margin-bottom: 5px; 
        }

        .page-title { 
            font-size: 20px; font-weight: 700; color: var(--accent); text-transform: uppercase; 
        } 

        .social-container { 
            /* হেডিং ফিক্সড করার কারণে কন্টেন্ট যেন হেডিংয়ের নিচে না ঢুকে যায়, তাই ওপরে 110px গ্যাপ দেওয়া হলো */
            padding: 110px 15px 20px 15px; 
            display: flex; flex-direction: column; gap: 12px; width: 100%; overflow-x: hidden; 
        }

        .section-title {
            font-size: 12px; color: var(--text-dim);
            margin-top: 10px; margin-bottom: 4px; margin-left: 5px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* --- প্রিমিয়াম বাটন ডিজাইন --- */
        .social-btn {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg);
            padding: 16px 20px; border-radius: 16px;
            text-decoration: none; color: var(--text-color);
            font-weight: 600; font-size: 14px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            width: 100%;
        }

        .social-btn:active { transform: scale(0.97); background: var(--border-color); }

        .btn-left { display: flex; align-items: center; gap: 15px; }
        
        .btn-left i {
            font-size: 22px; width: 26px; text-align: center;
        }

        .chevron-icon { color: var(--text-dim); font-size: 14px; }

        /* Brand Colors */
        .fb-color { color: #1877F2; }
        .yt-color { color: #FF0000; }
        .group-color { color: #0ea5e9; }
        .ig-color { background: -webkit-linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tk-color { color: #00f2ea; text-shadow: 1.5px 1.5px 0 #ff0050; }

    </style>

    body {

        -webkit-tap-highlight-color: transparent; /* বাটনে ট্যাপ করলে যে নীল ছায়া আসে সেটা বন্ধ করবে */
    }
    
    /* অ্যাপে যদি কোনো সার্চ বক্স বা কিছু লেখার জায়গা (input) থাকে, শুধু সেটাতে টাইপ করার অনুমতি দেওয়ার জন্য */
    input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
    }
</style>

<script>

</script>

    <script>
        function applyTranslations() {
            const lang = document.documentElement.getAttribute('data-lang');
            document.querySelectorAll('[data-bn]').forEach(el => {
                const translatedText = el.getAttribute('data-' + lang);
                if (translatedText) el.innerText = translatedText;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {

        });

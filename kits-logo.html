    <script>
        (function() {
            let savedLang = localStorage.getItem('savedLang') || 'bn';
            document.documentElement.setAttribute('data-lang', savedLang);

            // 🔥 জুম এবং স্ক্রিন নড়াচড়া বন্ধ করার ম্যাজিক 🔥
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) { event.preventDefault(); }
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) { event.preventDefault(); }
                lastTouchEnd = now;
            }, false);
            
            document.addEventListener('wheel', function(event) {
                if (event.ctrlKey) event.preventDefault();
            }, { passive: false });
        })();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0a0e17; 
            --card-surface: #111827;
            --input-bg: #1f2937;
            --border-line: #374151;
            --nextgen-orange: #f97316; 
            --orange-glow: rgba(249, 115, 22, 0.25);
            --text-light: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
            --header-bg: #111827; 
        }
        
        html, body {
            width: 100vw;
            max-width: 100%;
            overflow-x: hidden; 
            touch-action: pan-y; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        body.light-mode {
            --bg-deep: #f0f2f5; 
            --card-surface: #ffffff;
            --input-bg: #e5e7eb;
            --border-line: #d1d5db;
            --text-light: #111827;
            --text-dim: #6b7280;
            --header-bg: #ffffff;
        }

        body { 
            background-color: var(--bg-deep); color: var(--text-light); 
            font-family: 'Poppins', sans-serif; padding-bottom: 50px; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* 🔥 মেইন হেডিং, সার্চ বক্স এবং ক্যাটাগরি ফিক্সড রাখার সেকশন 🔥 */
        .fixed-header-section {
            position: fixed; 
            top: 0; left: 0; width: 100%; 
            background: var(--header-bg);
            z-index: 1000;
            border-bottom: 2px solid var(--nextgen-orange);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        /* নিউজ হাবের মতো পিওর সেন্টারিং হেডার */
        .header-top {
            padding: 25px 20px 20px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100%;
        }

        .header-title-wrapper {
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 10px; 
        }

        .page-title { 
            font-family: 'Poppins', sans-serif; 
            font-size: 20px; 
            font-weight: 700; 
            color: var(--nextgen-orange); 
            margin: 0; 
            text-transform: uppercase; 
        }

        .search-category-wrapper {
            padding: 0 15px 15px 15px; max-width: 500px; margin: 0 auto;
        }

        .search-box { position: relative; margin-bottom: 15px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .search-input {
            width: 100%; padding: 14px 15px 14px 45px; border-radius: 14px; background: var(--input-bg);
            border: 1px solid var(--border-line); color: var(--text-light); box-sizing: border-box; font-size: 14px; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--nextgen-orange); outline: none; box-shadow: 0 0 10px var(--orange-glow); }

        .categories-wrapper { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .categories-wrapper::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--card-surface); border: 1px solid var(--border-line); color: var(--text-dim);
            padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .cat-btn.active { background: var(--nextgen-orange); color: white; border-color: var(--nextgen-orange); box-shadow: 0 4px 10px var(--orange-glow); }

        /* 🔥 স্ক্রল হওয়া কনটেন্ট হেডিংয়ের নিচে যাতে না ঢোকে তাই padding-top দেওয়া হলো 🔥 */
        .container { padding: 200px 15px 15px 15px; max-width: 500px; margin: 0 auto; }

        .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .section-header {
            grid-column: 1 / -1; 
            font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 900;
            color: var(--nextgen-orange); text-transform: uppercase;
            margin-top: 10px; padding-bottom: 5px; border-bottom: 1px dashed var(--border-line);
        }

        .team-card {
            background: var(--card-surface); border: 1px solid var(--border-line); border-radius: 14px;
            padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .team-card:active { transform: scale(0.95); border-color: var(--nextgen-orange); }
        .team-logo { width: 45px; height: 45px; object-fit: contain; border-radius: 4px; }
        .team-name { font-size: 10px; font-weight: 700; text-align: center; color: var(--text-light); line-height: 1.3;}

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(3px);
            z-index: 2000; display: none; justify-content: center; align-items: flex-end; overscroll-behavior: contain;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-deep); width: 100%; max-width: 500px; height: 85vh;
            border-radius: 24px 24px 0 0; padding: 20px; box-sizing: border-box;
            border-top: 3px solid var(--nextgen-orange); display: flex; flex-direction: column;
            animation: slideUp 0.3s ease-out; transition: background-color 0.3s;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-line); padding-bottom: 15px;}
        .modal-team-info { display: flex; align-items: center; gap: 12px; }
        .modal-team-logo { width: 40px; height: 40px; object-fit: contain; }
        .modal-team-name { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: var(--text-light); text-transform: uppercase;}
        .close-btn { background: var(--input-bg); border: none; color: var(--text-dim); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; transition: 0.2s;}
        .close-btn:active { transform: scale(0.9); }

        .kits-list { overflow-y: auto; flex: 1; padding-bottom: 20px;}
        .kit-item {
            background: var(--card-surface); border: 1px solid var(--border-line); border-radius: 14px;
            padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; transition: 0.3s;
        }
        .kit-info { display: flex; align-items: center; gap: 15px; }
        .kit-preview { width: 45px; height: 45px; border-radius: 8px; background: var(--input-bg); border: 1px solid var(--border-line); object-fit: cover;}
        .kit-title { font-size: 13px; font-weight: 700; color: var(--text-light); margin-bottom: 3px;}
        .kit-status { font-size: 10px; color: var(--success); font-weight: 600;}

        .copy-btn {
            background: var(--nextgen-orange); color: white; border: none; border-radius: 8px;
            padding: 8px 15px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .copy-btn.copied { background: var(--success); }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: none; z-index: 3000;
        }
    </style>

<style>
    body {
        -webkit-touch-callout: none; /* মোবাইল ব্রাউজারে লং-প্রেস পপ-আপ মেনু বন্ধ করবে */
        -webkit-user-select: none;   /* Chrome, Safari, Android, iOS-এ সিলেক্ট বন্ধ করবে */
        -moz-user-select: none;      /* Firefox-এ সিলেক্ট বন্ধ করবে */
        -ms-user-select: none;       /* Edge-এ সিলেক্ট বন্ধ করবে */
        user-select: none;           /* সাধারণ সিলেক্ট বন্ধ করবে */
        -webkit-tap-highlight-color: transparent; /* বাটনে ট্যাপ করলে যে নীল ছায়া আসে সেটা বন্ধ করবে */
    }
    
    /* অ্যাপে যদি কোনো সার্চ বক্স বা কিছু লেখার জায়গা (input) থাকে, শুধু সেটাতে টাইপ করার অনুমতি দেওয়ার জন্য */
    input, textarea {
        -webkit-user-select: auto;
        user-select: auto;
    }
</style>

<script>
    // লং-প্রেস (ধরে রাখা) বা রাইট ক্লিক করলে যে অপশন মেনু আসে, সেটা একদম ব্লক করার জন্য
    window.oncontextmenu = function(event) {
        event.preventDefault();
        event.stopPropagation();
        return false;
    };
</script>
<!-- Copy Protection Code Ends -->

                                                let currentLang = localStorage.getItem('savedLang') || 'bn';
        let activeCategory = 'all';

        const categoryNames = {
            'national': { bn: 'জাতীয় দল', en: 'National Teams' },
            'premier': { bn: 'প্রিমিয়ার লিগ', en: 'Premier League' },
            'laliga': { bn: 'লা লিগা', en: 'La Liga' },
            'seriea': { bn: 'সিরি আ', en: 'Serie A' },
            'bundesliga': { bn: 'বুন্দেসলিগা', en: 'Bundesliga' },
            'ligue1': { bn: 'লিগ ১', en: 'Ligue 1' },
            'superlig': { bn: 'টার্কিশ লিগ', en: 'Turkish Süper Lig' },
            'saudi': { bn: 'সৌদি প্রো লিগ', en: 'Saudi Pro League' },
            'mls': { bn: 'এমএলএস', en: 'MLS' },
            'brasileirao': { bn: 'ব্রাসিলেইরাও', en: 'Brasileirão' },
            'primera': { bn: 'আর্জেন্টাইন প্রাইমেরা', en: 'Argentine Primera' },
            'others': { bn: 'অন্যান্য', en: 'Others' }
        };

        function applyTheme() {
            let currentTheme = localStorage.getItem('savedTheme') || 'dark';
            if (currentTheme === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
        }

        function applyLanguage() {
            let searchBox = document.getElementById('searchInput');
            if(searchBox) {
                searchBox.placeholder = currentLang === 'bn' ? 'দল বা ক্লাব খুঁজুন...' : 'Search teams...';
            }
            document.querySelectorAll('[data-bn]').forEach(el => {
                el.innerText = currentLang === 'bn' ? el.getAttribute('data-bn') : el.getAttribute('data-en');
            });
        }

function renderTeams(searchQuery = '') {
    const grid = document.getElementById('teamsGrid');
    if(!grid) return;
    
    grid.innerHTML = '';
    const searchStr = searchQuery.toLowerCase();
    const catsToRender = activeCategory === 'all' ? Object.keys(categoryNames) : [activeCategory];

    catsToRender.forEach(catKey => {
        // এখানে includes এর জায়গায় startsWith ব্যবহার করা হয়েছে
        let teamsInCat = teamsData.filter(t => t.category === catKey && (t.name_bn.toLowerCase().startsWith(searchStr) || t.name_en.toLowerCase().startsWith(searchStr)));
        
        if(teamsInCat.length > 0) {
            if(activeCategory === 'all') {
                const headerName = currentLang === 'bn' ? categoryNames[catKey].bn : categoryNames[catKey].en;
                grid.innerHTML += `<div class="section-header">${headerName}</div>`;
            }
            teamsInCat.sort((a, b) => a.name_en.localeCompare(b.name_en));
            teamsInCat.forEach(team => {
                const name = currentLang === 'bn' ? team.name_bn : team.name_en;
                grid.innerHTML += `
                    <div class="team-card" onclick="openModal('${team.id}')">
                        <img src="${team.logo}" class="team-logo" loading="eager" fetchpriority="high" onerror="this.src='https://via.placeholder.com/45?text=Logo'">
                        <div class="team-name">${name}</div>
                    </div>
                `;
            });
        }
    });
}

        function openModal(teamId) {
            const team = teamsData.find(t => t.id === teamId);
            if(!team) return;
            
            document.getElementById('modalLogo').src = team.logo;
            document.getElementById('modalTeamName').innerText = currentLang === 'bn' ? team.name_bn : team.name_en;
            
            document.getElementById('instructionText').innerHTML = currentLang === 'bn' 
                ? "নিচের <b>Copy</b> বাটনে ক্লিক করে লিংকটি কপি করুন এবং DLS গেমে গিয়ে পেস্ট করুন।"
                : "Click the <b>Copy</b> button below and paste the link into your DLS game.";

            const list = document.getElementById('kitsListContainer');
            list.innerHTML = ''; 
            
            team.kits.forEach(kit => {
                const kitName = currentLang === 'bn' ? kit.name_bn : kit.name_en;
                const btnText = currentLang === 'bn' ? 'কপি করুন' : 'Copy';
                list.innerHTML += `
                    <div class="kit-item">
                        <div class="kit-info">
                            <img src="${kit.url}" class="kit-preview" loading="eager" fetchpriority="high" onerror="this.src='https://via.placeholder.com/45?text=Kit'">
                            <div>
                                <div class="kit-title">${kitName}</div>
                                <div class="kit-status">Available</div>
                            </div>
                        </div>
                        <button class="copy-btn" onclick="copyLink('${kit.url}', this)">
                            <i class="fa-regular fa-copy"></i> <span>${btnText}</span>
                        </button>
                    </div>
                `;
            });

            document.getElementById('kitModal').classList.add('active');
            history.pushState({ modal: 'open' }, '', '#kitOpen');
        }

        function closeModal() {
            if (document.getElementById('kitModal').classList.contains('active')) {
                history.back(); 
            }
        }

        window.addEventListener('popstate', function(event) {
            if (document.getElementById('kitModal').classList.contains('active')) {
                document.getElementById('kitModal').classList.remove('active');
            }
        });

        function copyLink(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                btn.innerHTML = currentLang === 'bn' ? '<i class="fa-solid fa-check-circle"></i> <span>কপি হয়েছে</span>' : '<i class="fa-solid fa-check-circle"></i> <span>Copied</span>';
                btn.classList.add('copied');
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTeams();
        }

        function filterTeams() { renderTeams(document.getElementById('searchInput').value); }

        // আধা সেকেন্ড (০.৫s) পর ব্যাকগ্রাউন্ডে ছবি লোড করার ম্যাজিক
        function gentlePreload() {
            setTimeout(() => {
                teamsData.forEach(team => {
                    team.kits.forEach(kit => {
                        const img = new Image();
                        img.src = kit.url;
                    });
                });
            }, 500); // 500 মানে আধা সেকেন্ড। আপনি চাইলে 1000 (১ সেকেন্ড) বা 100 (০.১ সেকেন্ড) লিখে ট্রাই করে দেখতে পারেন।
        }

        function startApp() {
            applyTheme();
            applyLanguage();
            renderTeams();
            document.body.style.display = 'block';
            
            // পেজ রেডি হওয়ার পর জেন্টেল প্রিলোড শুরু হবে
            gentlePreload(); 
        }

        startApp();
// 🔥 জাভাস্ক্রিপ্ট দিয়ে জুম আটকানোর চরম ম্যাজিক 🔥
document.addEventListener('touchstart', function(event) {
    if (event.touches.length > 1) { 
        event.preventDefault(); // দুই আঙুল দিয়ে জুম করা বন্ধ
    }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
    let now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) { 
        event.preventDefault(); // ডাবল ট্যাপ করে জুম করা বন্ধ
    }
    lastTouchEnd = now;
}, false);

document.addEventListener('wheel', function(event) {
    if (event.ctrlKey) event.preventDefault(); // পিসির মাউস হুইল জুম বন্ধ
}, { passive: false });

    </script>
</body>
</html>

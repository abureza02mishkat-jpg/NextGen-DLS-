    <script>
        (function() {
            let savedTheme = localStorage.getItem('savedTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            let savedLang = localStorage.getItem('savedLang') || 'bn';
            document.documentElement.setAttribute('data-lang', savedLang);
            document.documentElement.dir = (savedLang === 'ar') ? 'rtl' : 'ltr';

            // 🔥 জুম আটকানোর ম্যাজিক কোড 🔥
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) { event.preventDefault(); } 
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) { event.preventDefault(); } 
                lastTouchEnd = now;
            }, false);
            
            document.addEventListener('wheel', function(event) {
                if (event.ctrlKey) event.preventDefault(); 
            }, { passive: false });

            // 🔥 সার্চ বক্সে Null প্রবলেম ফিক্স করার ম্যাজিক 🔥
            document.addEventListener("DOMContentLoaded", function() {
                let searchInput = document.getElementById('searchInput');
                if(searchInput) {
                    if(savedLang === 'en') searchInput.placeholder = 'Search Formation...';
                    else if(savedLang === 'vi') searchInput.placeholder = 'Tìm đội hình...';
                    else if(savedLang === 'ar') searchInput.placeholder = 'البحث عن تشكيلة...';
                    else searchInput.placeholder = 'ফর্মেশন খুঁজুন...';
                }
            });
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-main: #0a0e17; --text-color: #f3f4f6; --text-muted: #8492a6; --card-bg: #111827; --inner-bg: #0d121c;
            --clr-blue: #3b82f6; --clr-cyan: #0ea5e9; --clr-green: #10b981; --clr-red: #ef4444; --clr-gold: #facc15;
            --soft-shadow: 4px 4px 12px rgba(0,0,0,0.5), -4px -4px 12px rgba(255,255,255,0.01);
            --inset-shadow: inset 2px 2px 8px rgba(0,0,0,0.5), inset -2px -2px 8px rgba(255,255,255,0.01);

            --card-bg: #ffffff; 
            --inner-bg: #f9fafb;

        html[data-lang="en"] .lang-bn, html[data-lang="en"] .lang-vi, html[data-lang="en"] .lang-ar { display: none !important; }
        html[data-lang="bn"] .lang-en, html[data-lang="bn"] .lang-vi, html[data-lang="bn"] .lang-ar { display: none !important; }
        html[data-lang="vi"] .lang-bn, html[data-lang="vi"] .lang-en, html[data-lang="vi"] .lang-ar { display: none !important; }
        html[data-lang="ar"] .lang-bn, html[data-lang="ar"] .lang-en, html[data-lang="ar"] .lang-vi { display: none !important; }

        body { 
            background-color: var(--bg-main); color: var(--text-color); font-family: 'Poppins', sans-serif; 
            margin: 0; padding-bottom: 50px; transition: 0.3s; 
            overflow-x: hidden; width: 100vw; max-width: 100%;
            touch-action: pan-y; 
        }
        
        .header { 
            background: var(--card-bg); padding: 25px 20px 20px 20px; 
            border-bottom: 2px solid var(--accent-orange);
            position: sticky; top: 0; z-index: 1000; display: flex; 
            justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%;

        .header-title-wrapper { display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .page-title { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .guide-container { padding: 15px 15px 25px 15px; max-width: 600px; margin: 0 auto; }

        .top-controls { display: flex; justify-content: flex-start; margin-bottom: 12px; }
        html[dir="rtl"] .top-controls { justify-content: flex-end; }
        
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; color: var(--text-color);
            background: var(--card-bg); padding: 10px 20px; border-radius: 30px; 
            box-shadow: var(--soft-shadow); border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins', sans-serif;
        }
        .back-btn i { color: var(--accent-orange); font-size: 16px; }
        html[dir="rtl"] .back-btn i { transform: rotate(180deg); }
        .back-btn:active { transform: scale(0.95); box-shadow: var(--inset-shadow); }

        .search-box {
            display: flex; align-items: center; background: var(--card-bg); border-radius: 100px;
            padding: 12px 20px; margin-bottom: 25px; box-shadow: var(--inset-shadow);
            border: 2px solid var(--orange-glow);
        }
        .search-box i { color: var(--accent-orange); }
        .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-color); font-family: 'Poppins'; font-size: 14px; margin-left: 10px; }
        html[dir="rtl"] .search-box input { margin-left: 0; margin-right: 10px; }

        .formation-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; animation: fadeIn 0.4s; }
        .formation-card {
            background: var(--card-bg); border-radius: 16px; padding: 22px 10px; text-align: center;

        .formation-icon { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 1.2px; color: var(--accent-orange); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .article-wrapper { padding: 15px 15px 25px 15px; background: var(--inner-bg); border-radius: 16px; box-shadow: var(--inset-shadow); margin-top: 5px;}
        .formation-title-big { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 900; margin: 0 0 15px 0; color: var(--accent-orange); letter-spacing: 2px; text-align: center; text-transform: uppercase;}
        
        .guide-card {
            background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 22px; 
            box-shadow: var(--soft-shadow); border: var(--border-glow); text-align: left;
            border-left: 5px solid var(--accent-orange) !important;
        }
        html[dir="rtl"] .guide-card { border-left: none !important; border-right: 5px solid var(--accent-orange) !important; text-align: right; }
        
        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; width: 100%;}
        
        .card-title, .card-title *, #dynamic-content .card-title, #dynamic-content .card-title * {

            color: var(--accent-orange) !important; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .guide-card p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--text-color); opacity: 0.9; text-align: left; width: 100%; }
        html[dir="rtl"] .guide-card p { text-align: right; }

        .article-signature { text-align: center; margin-top: 40px; padding-top: 30px; border-top: 2px dashed rgba(255,255,255,0.05); }
        .signature-logo { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: var(--text-muted); letter-spacing: 1.5px;}
        .signature-logo span { color: var(--accent-orange); }
        .sig-sub { font-size: 11px; margin-top: 4px; color: var(--text-muted); opacity: 0.6; text-transform: uppercase; letter-spacing: 1px;}
    </style>

    <script>
        const formationDatabase = {
            "4-4-2": {
                bn: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">ট্যাকটিক্যাল ওভারভিউ</span></div>
                    <p>ফুটবলের অন্যতম জনপ্রিয় এবং চিরাচরিত ফরমেশন ৪-৪-২। তবে শুরুতেই একটা বিষয় পরিষ্কার করে নেওয়া ভালো—বাস্তব জীবনের ফুটবলের সাথে গেমের ফরমেশনের কার্যকারিতার অনেক পার্থক্য থাকে। তাই আমরা পুরোপুরি গেমপ্লে বা ইন-গেম এক্সপেরিয়েন্সের ওপর ভিত্তি করেই এই আলোচনা সাজিয়েছি।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-green);">ভালো দিকসমূহ </span></div>
                    <p>১. এই ফরমেশনের অন্যতম বড় শক্তি হলো এর মিডফিল্ড। এখানে আপনি চারজন মিডফিল্ডার পাচ্ছেন, যার মধ্যে দুজন উইংয়ে (RM এবং LM) দায়িত্ব পালন করেন আর দুইজন (CM)। আপনি যদি মাঝমাঠের দখল নিয়ে খেলতে পছন্দ করেন, তবে এটি আপনার জন্য দারুণ একটি চয়েস হতে পারে। তবে মনে রাখবেন, চারজন মিডফিল্ডারকে সঠিকভাবে নিয়ন্ত্রণ করা কিছুটা চ্যালেঞ্জিং। এর জন্য প্রয়োজন প্রচুর প্র্যাকটিস এবং ধৈর্য। সাইড থেকে লং পাসের ক্ষেত্রে আপনাকে হতে হবে অত্যন্ত সচেতন। পজিশন না দেখে বা হুটহাট জোরে লং পাস দিলে বল হারানোর ঝুঁকি থাকে, তাই বুঝেশুনে পাসের নিয়ন্ত্রণ রাখতে পারলে এই ফরমেশন আপনাকে এক অনন্য গেমিং অভিজ্ঞতা দেবে।</p>
                    <p style="margin-top:15px;">২. আক্রমণভাগের কথা বলতে গেলে, এই ফরমেশনে আপনি পাচ্ছেন দুজন প্রপার সেন্টার ফরোয়ার্ড। বর্তমান ডিএলএস মেটা অনুযায়ী শুধুমাত্র ক্রস খেলে গোল পাওয়া এখন বেশ কঠিন। সেই জায়গায় ৪-৪-২ ফরমেশনে দুজন ফরোয়ার্ড থাকায় পাসিং গেম খেলা খুব সহজ হয়ে যায়। একজন স্ট্রাইকার থেকে অন্যজনের কাছে কুইক পাসিং করে গোল বের করা অনেক বেশি কার্যকর। যারা আক্রমণভাগে সরাসরি পাসিং পছন্দ করেন, তাদের জন্য এটি সেরা একটি অপশন।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-red);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-red);">দুর্বলতা</span></div>
                    <p>১. এই ফরমেশনের সবচাইতে বড় চ্যালেঞ্জ হলো ডিফেন্স সামলানো। ডিএলএস-এ যেহেতু প্রতিপক্ষও প্রায়ই দুজন স্ট্রাইকার নিয়ে খেলে, তাই আপনার দুজন সেন্টার ব্যাকের ওপর প্রচুর চাপ পড়ে। একজন ডিফেন্ডার যদি পজিশন হারায় বা ট্যাকেল দিতে ভুল করে, তবে প্রতিপক্ষ অনায়াসেই গোল বের করে নিতে পারে।</p>
                    <p style="margin-top:15px;">২. এখানে একটি মজার বিষয় হলো, এই ফরমেশনে আপনার ফুল-ব্যাকদের (RB এবং LB) ভূমিকা খুব একটা চোখে পড়ে না। যেহেতু সামনে (RM/LM) মিডফিল্ডাররা থাকে, তাই তাদের ওপরের দিকে ওঠার সুযোগ কম থাকে, আবার ডিফেন্সের মূল কাজটা সেন্টার ব্যাকরাই করে থাকে। কারণ DLS এ এমন অপনেন্ট খুব কম পাওয়া যায় যারা LW/RW নিয়ে খেলে যে তাদেরকে আটকানোর জন্য LB/RB এর দরকার হবে। তাই চার জন ডিফেন্ডারের বদলে তিনজন ডিফেন্ডার দিয়ে খেললে ডিফেন্স লাইন হয়তো আরও বেশি সুসংহত থাকতো। তবে আপনি যদি ফুল-ব্যাকদের কাজে লাগিয়ে বল উইং দিয়ে ওপরে তুলতে পারেন, তবে আপনার আক্রমণ আরও ধারালো হবে।</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-gold);">
                    <div class="card-header"><span class="card-title" style="color: var(--clr-gold);">এক্সপার্ট টিপস</span></div>
                    <p>৪-৪-২ ফরমেশনে সফল হতে হলে আপনাকে অবশ্যই ডিফেন্সিভ মোডে খেলার মানসিকতা রাখতে হবে। শর্ট পাসের মাধ্যমে বিল্ড-আপ গেম খেলা এই ফরমেশনের সাফল্যের চাবিকাঠি। যদিও শুরুতে ডিফেন্স সামলানো বা চারজন মিডফিল্ডারের সাথে মানিয়ে নেওয়া কঠিন মনে হতে পারে, কিন্তু একবার আপনি এই পদ্ধতিতে অভ্যস্ত হয়ে গেলে আপনার গেমপ্লে অন্য উচ্চতায় পৌঁছে যাবে।</p>
                </div>`,
                en: `
                <div class="guide-card">
                    <div class="card-header"><span class="card-title">Tactical Overview</span></div>
                    <p>4-4-2 is one of the most popular and classic formations in football. However, it's better to clarify one thing first—there are many differences in formation effectiveness between real-life football and the game. Therefore, we have structured this discussion entirely based on gameplay and in-game experience.</p>
                </div>
                <div class="guide-card" style="border-left-color: var(--clr-green);">

            document.getElementById('main-grid').style.display = 'none';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('formation-detail-container').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('formation-detail-container').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('main-grid').style.display = 'grid';
            document.getElementById('searchSection').style.display = 'flex';
            document.getElementById('searchInput').value = '';
            search();
        }

        function syncEverything() {
            try {
                // ১. থিম চেক (Light/Dark)
                const theme = localStorage.getItem('savedTheme') || 'dark';
                document.body.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
                
                // ২. ভাষা চেক (BN/EN/VI/AR)
                const lang = localStorage.getItem('savedLang') || 'bn';
                document.documentElement.setAttribute('data-lang', lang);
                document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

                document.querySelectorAll('.lang-bn, .lang-en, .lang-vi, .lang-ar').forEach(el => {
                    el.style.display = 'none';
                });
                document.querySelectorAll('.lang-' + lang).forEach(el => {
                    el.style.display = 'inline-block';
                });

                // সার্চ বক্সের প্লেসহোল্ডার
                let input = document.getElementById('searchInput');
                if (input) {
                    let ph = input.getAttribute('data-' + lang + '-ph');
                    if (ph) input.placeholder = ph;
                }
            } catch(e) { console.error(e); }
        }

        // প্রতি ৫০০ মিলিসেকেন্ডে চেক করবে
        setInterval(syncEverything, 500);
        window.onload = syncEverything;

    </script>
</body>
</html>

            document.documentElement.setAttribute('data-theme', initTheme);
            let savedLang = localStorage.getItem('savedLang') || 'bn';
            document.documentElement.setAttribute('data-lang', savedLang);

            document.addEventListener('touchstart', function(event) { if (event.touches.length > 1) { event.preventDefault(); } }, { passive: false });
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                let now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) { event.preventDefault(); }
                lastTouchEnd = now;
            }, false);
            document.addEventListener('wheel', function(event) { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
        })();

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root { 
            --bg-main: #0a0e17; --bg-panel: #111827; --bg-inner: #06090f; 
            --text-main: #f1f2f6; --text-muted: #808e9b; --primary: #f97316; 
            --border-light: rgba(255,255,255,0.05); 
            --accent-orange: #f97316;
        }
        :root[data-theme="light"] { 
            --bg-main: #f1f4f9; --bg-panel: #ffffff; --bg-inner: #e5e7eb; 
            --text-main: #1e293b; --text-muted: #4b5563; --border-light: rgba(0,0,0,0.1); 
        }
        
        html, body { 
            width: 100vw; max-width: 100%; overflow-x: hidden; touch-action: pan-y; 
            background-color: var(--bg-main); color: var(--text-main); padding-bottom: 50px; 
            transition: background-color 0.3s ease, color 0.3s ease; user-select: none; 
            -webkit-user-select: none; font-family: 'Poppins', sans-serif; 
        }
        
        .sticky-top-section { 
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; 
            background-color: var(--bg-main); border-bottom: 2px solid var(--accent-orange); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); padding-bottom: 15px; 
        }
        
        .header { 
            padding: 25px 20px 20px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100%;
        }
        
        .header-title-wrapper { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 10px; 
        }
        
        .page-title { 
            font-family: 'Poppins', sans-serif;
            font-size: 20px; 
            font-weight: 700; 
            color: var(--accent-orange); 
            text-transform: uppercase; 
        }

        .filter-bar { display: flex; flex-direction: column; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 5px 15px 0 15px; }

        .search-box { width: 100%; position: relative; }
        .search-box input { width: 100%; padding: 12px 15px 12px 40px; border-radius: 25px; border: 1px solid var(--border-light); background: var(--bg-inner); color: var(--text-main); outline: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; transition: 0.3s; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;}
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }

        .horizontal-scroll-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; align-items: center; }
        .horizontal-scroll-filters::-webkit-scrollbar { display: none; }
        .pill-select { width: auto; flex-shrink: 0; padding: 8px 30px 8px 15px; border-radius: 20px; border: 1px solid var(--border-light); background-color: var(--bg-inner); color: var(--text-muted); font-size: 12px; font-weight: 600; outline: none; cursor: pointer; white-space: nowrap; appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23808e9b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto; transition: 0.2s; font-family: 'Poppins', sans-serif;}
        .pill-select:focus { border-color: var(--primary); color: var(--primary); }
        
        /* 🔥 এখানেই কার্ডের উপরের গ্যাপ (padding-top) ২৪০px করে স্পেস বাড়ানো হয়েছে 🔥 */
        .cards-grid { max-width: 1200px; margin: 0 auto; padding: 240px 15px 35px 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); justify-content: center; gap: 30px; } 

        .theme-Normal { --card-theme: #f1c40f; } .theme-Team-of-25 { --card-theme: #10ac84; } .theme-Classic { --card-theme: #bdc3c7; } .theme-Kickoff-Star { --card-theme: #ff4757; } .theme-Champion { --card-theme: #eccc68; } .theme-Dream-Stars-26 { --card-theme: #ff9ff3; } .theme-Dream-Stars-25 { --card-theme: #9b59b6; }
        
        .player-wrapper { background: var(--bg-panel); border-top: 6px solid var(--card-theme); border-bottom: 6px solid var(--card-theme); border-left: 1px solid var(--card-theme); border-right: 1px solid var(--card-theme); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: background-color 0.3s; overflow: hidden; }
        .card-showcase { width: 100%; height: 350px; display: flex; justify-content: center; align-items: center; background: transparent; border-radius: 12px; }
        .card-showcase img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
        
        .action-bar { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px;}
        .toggle-btn, .dl-btn-simple { flex: 1; padding: 12px 5px; border-radius: 8px; font-size: 12px; font-family: 'Poppins', sans-serif; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; text-transform: uppercase; white-space: nowrap; }
        .toggle-btn { background: transparent; color: var(--text-main); border: 2px solid var(--card-theme); }
        .dl-btn-simple { background: var(--card-theme); color: #000; border: 2px solid var(--card-theme); }
        
        .details-panel { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        .dp-name { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center;}
        .dp-badge { font-family: 'Poppins', sans-serif; background: var(--bg-inner); border: 1px solid var(--card-theme); color: var(--card-theme); font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 25px; white-space: nowrap; display: inline-block; line-height: 1.2;}
        
        .dp-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 30px; }
        .dp-info-badge { font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; background: var(--bg-inner); padding: 10px 5px; border-radius: 10px; font-size: 10px; font-weight: 800; color: var(--text-muted); border: 1px solid var(--border-light); box-shadow: 0 2px 5px rgba(0,0,0,0.05); white-space: nowrap; transition: 0.3s; line-height: 1.4; }
        .dp-info-badge i { color: var(--card-theme); font-size: 12px;}

        .no-results { text-align: center; grid-column: 1 / -1; padding: 50px; font-size: 18px; color: var(--primary); font-family: 'Poppins', sans-serif; font-weight: bold;}

            let cardStates = {};
        playersData.forEach(p => { cardStates[p.id] = 'max'; });
        const categoryColors = { 'Normal': '#f1c40f', 'Team of 25': '#10ac84', 'Classic': '#bdc3c7', 'Kickoff Star': '#ff4757', 'Champion': '#eccc68', 'Dream Stars 26': '#ff9ff3', 'Dream Stars 25': '#9b59b6' };
                function applyLanguage() {
            const dict = langDict[currentLang];
            document.getElementById('titleText').textContent = dict.title;
            document.getElementById('filterName').placeholder = dict.searchLbl + '...';
            document.querySelector('#filterCategory option[value="all"]').textContent = dict.allCategories;
            document.querySelector('#filterPosition option[value="all"]').textContent = dict.allPositions;
            document.getElementById('optTop').textContent = dict.sortTop;
            document.getElementById('optFast').textContent = dict.sortFast;
            document.getElementById('optTall').textContent = dict.sortTall;
            document.getElementById('optShort').textContent = dict.sortShort;
            
            const clubSelect = document.getElementById('filterClub'); 
            clubSelect.innerHTML = `<option value="all">${dict.allClubs}</option>`;
            [...new Set(playersData.map(p => p.club))].sort().forEach(c => clubSelect.innerHTML += `<option value="${c}">${c}</option>`);
            
            const countrySelect = document.getElementById('filterCountry'); 
            countrySelect.innerHTML = `<option value="all">${dict.allCountries}</option>`;
            [...new Set(playersData.map(p => p.country))].sort().forEach(c => countrySelect.innerHTML += `<option value="${c}">${c}</option>`);
            renderCards();
        }

        function getRadarPoint(val, index, maxR) { const angle = index * 45 * Math.PI / 180; const r = (val / 100) * maxR; return `${125 + r * Math.sin(angle)},${125 - r * Math.cos(angle)}`; }
        
        function generateRadar(stats, colorTheme, position) {
            const labels = position === 'GK' ? ['SPE', 'ACC', 'GKR', 'STR', 'CON', 'PAS', 'GKH', 'TAC'] : ['SPE', 'ACC', 'STA', 'STR', 'CON', 'PAS', 'SHO', 'TAC'];
            const vals = [stats.spe, stats.acc, stats.sta, stats.str, stats.con, stats.pas, stats.sho, stats.tac];
            let webColor = currentTheme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.05)';
            let textColor = currentTheme === 'light' ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.7)';
            let bgWeb = ''; for(let r=25; r<=75; r+=25) bgWeb += `<polygon points="${[0,1,2,3,4,5,6,7].map(i=>getRadarPoint(100,i,r)).join(' ')}" fill="none" stroke="${webColor}"/>`;
            let lines = ''; for(let i=0; i<8; i++) lines += `<line x1="125" y1="125" x2="${getRadarPoint(100,i,75).split(',')[0]}" y2="${getRadarPoint(100,i,75).split(',')[1]}" stroke="${webColor}"/>`;
            let polyPoints = vals.map((v, i) => getRadarPoint(v, i, 75)).join(' ');
            let texts = ''; labels.forEach((lbl, i) => { let pt = getRadarPoint(100, i, 100); let [x,y] = pt.split(','); let valColor = vals[i] >= 90 ? '#00d8d6' : (vals[i] >= 80 ? '#0be881' : (vals[i] >= 70 ? '#fbc531' : (vals[i] >= 60 ? '#e67e22' : '#ff3f34'))); texts += `<text x="${x}" y="${y-6}" fill="${textColor}" font-size="11" font-weight="800" text-anchor="middle">${lbl}</text><text x="${x}" y="${+y+10}" fill="${valColor}" font-size="14" font-weight="900" text-anchor="middle">${vals[i]}</text>`; });
            return `<svg viewBox="0 0 250 250" width="100%" height="100%">${bgWeb} ${lines} <polygon points="${polyPoints}" fill="${colorTheme}44" stroke="${colorTheme}" stroke-width="2.5"/> ${texts}</svg>`;
        }
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const sName = document.getElementById('filterName').value.toLowerCase().trim();
            const sCat = document.getElementById('filterCategory').value;
            const sPos = document.getElementById('filterPosition').value;
            const sClub = document.getElementById('filterClub').value;
            const sCountry = document.getElementById('filterCountry').value;
            const sSort = document.getElementById('filterSort').value;

            let filtered = playersData.filter(p => {
                let isNameMatched = false;
                if (sName === '') { 
                    isNameMatched = true; 
                } else {
                    // 🔥 Magic Regex Search: Only checks starting of words 🔥
                    let escapedSearch = sName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    let regex = new RegExp('(^|\\s|-)' + escapedSearch, 'i');
                    isNameMatched = regex.test(p.fullName) || regex.test(p.name);
                }
                return isNameMatched && (sCat === 'all' || p.category === sCat) && (sPos === 'all' || p.position === sPos) && (sClub === 'all' || p.club === sClub) && (sCountry === 'all' || p.country === sCountry);
            });

            filtered.sort((a, b) => {
                if (sSort === 'top') {
                    if (b.maxRating !== a.maxRating) return b.maxRating - a.maxRating;
                    let statsA = a.statsMax.spe + a.statsMax.acc + a.statsMax.sta + a.statsMax.str + a.statsMax.con + a.statsMax.pas + a.statsMax.sho + a.statsMax.tac;
                    let statsB = b.statsMax.spe + b.statsMax.acc + b.statsMax.sta + b.statsMax.str + b.statsMax.con + b.statsMax.pas + b.statsMax.sho + b.statsMax.tac;
                    if (statsB !== statsA) return statsB - statsA;
                    return a.name.localeCompare(b.name);
                } 
                else if (sSort === 'fast') {
                    let speA = a.statsBase.spe; let speB = b.statsBase.spe;
                    if (speB !== speA) return speB - speA;
                    if (b.baseRating !== a.baseRating) return b.baseRating - a.baseRating;
                    return a.name.localeCompare(b.name);
                }
                else if (sSort === 'tall') {
                    let hA = parseInt(a.height); let hB = parseInt(b.height);
                    if (hB !== hA) return hB - hA;
                    return b.maxRating - a.maxRating;
                }
                else if (sSort === 'short') {
                    let hA = parseInt(a.height); let hB = parseInt(b.height);
                    if (hA !== hB) return hA - hB;
                    return b.maxRating - a.maxRating;
                }
            });

            if (filtered.length === 0) { grid.innerHTML = `<div class="no-results">${langDict[currentLang].noResult}</div>`; return; }
            
            let htmlString = '';
            filtered.forEach(p => {
                const state = cardStates[p.id]; const isMax = state === 'max';
                const currentImg = isMax ? p.imgMax : p.imgBase; const currentOVR = isMax ? p.maxRating : p.baseRating;
                const currentStats = isMax ? p.statsMax : p.statsBase;
                const cardStateText = isMax ? langDict[currentLang].showMaxText : langDict[currentLang].showBaseText;
                const toggleBtnText = isMax ? langDict[currentLang].showBaseBtn : langDict[currentLang].showMaxBtn;
                const dlBtnText = langDict[currentLang].saveCard;
                
                const themeClass = `theme-${p.category.replace(/\s+/g, '-')}`;
                let themeColor = categoryColors[p.category] || '#f97316';

                htmlString += `
                    <div class="player-wrapper ${themeClass}">
                        <div class="card-showcase"><img src="${currentImg}" alt="${p.name}" loading="lazy"></div>
                        <div class="action-bar">
                            <button class="toggle-btn" onclick="toggleState('${p.id}')">
                                <i class="fa-solid fa-rotate"></i> ${toggleBtnText}
                            </button>
                            <button class="dl-btn-simple" onclick="downloadImg('${p.id}', '${p.name}')" title="Download Image">
                                ${dlBtnText} <i class="fa-solid fa-download"></i>
                            </button>
                        </div>
                        <div class="details-panel">
                            <div class="dp-name">${p.fullName}</div>
                            <div class="dp-badge">${cardStateText} • OVR ${currentOVR}</div>
                            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 25px;">
                                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                                    <span class="dp-info-badge" style="width: 100%;"><i class="fa-solid fa-flag"></i> ${p.country}</span>
                                    <span class="dp-info-badge" style="width: 100%;"><i class="fa-solid fa-shirt"></i> ${p.club}</span>
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                                    <span class="dp-info-badge" style="width: 100%;"><i class="fa-solid fa-location-dot"></i> ${p.position}</span>
                                    <span class="dp-info-badge" style="width: 100%;"><i class="fa-solid fa-ruler-vertical"></i> ${p.height}CM</span>
                                    <span class="dp-info-badge" style="width: 100%;"><i class="fa-solid fa-shoe-prints"></i> ${p.foot}</span>
                                </div>
                            </div>
                            <div class="radar-wrapper"><div class="radar-container">${generateRadar(currentStats, themeColor, p.position)}</div></div>
                        </div>
                    </div>`;
            });
            grid.innerHTML = htmlString;
        }

        function toggleState(id) { cardStates[id] = cardStates[id] === 'max' ? 'base' : 'max'; renderCards(); }
        
        async function downloadImg(id, name) {
            const state = cardStates[id]; const player = playersData.find(p => p.id === id);
            const imageSrc = state === 'max' ? player.imgMax : player.imgBase;
            const a = document.createElement('a'); a.href = imageSrc; a.download = `${name}_${state}.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        document.addEventListener('DOMContentLoaded', applyLanguage);
    </script>
